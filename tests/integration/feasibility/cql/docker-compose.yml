services:
  fhir-server:
    image: "ghcr.io/samply/blaze@sha256:d419ab733f79b6da1e92f39f03865a83adc754c832d142dcf3e92b5a1f96490f"  #v1.11.0
    environment:
      BASE_URL: "http://blaze:8080/fhir"
      JAVA_TOOL_OPTIONS: "-Xmx1g"
      LOG_LEVEL: "debug"
      ENFORCE_REFERENTIAL_INTEGRITY: "false"
    ports:
      - "8082:8080"
    volumes:
      - "blaze-data:/app/data"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  blaze-data: