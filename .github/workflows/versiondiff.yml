name: versiondiff


on:
  workflow_dispatch:
    inputs:
      previous:
        description: "Git ref of the previous version. Defaults to 'prod' (version currently deployed in production)"
        required: false
        default: "prod"
        type: string
      current:
        description: "Git ref of the current version"
        required: true
        type: string
      diff_level:
        description: "Minimum diff level to include in the reports"
        required: false
        default: "informational"
        type: choice
        options:
          - transparent
          - informational
          - breaking
  workflow_call:
    inputs:
      previous:
        description: "Git ref of the previous version. Defaults to 'prod' (version currently deployed in production)"
        required: false
        default: "prod"
        type: string
      diff_level:
        description: "Minimum diff level to include in the reports. One of 'transparent', 'informational, or 'breaking'"
        required: false
        default: "informational"
        type: string
    outputs:
      verdict:
        description: "Most severe change type detected over all diff reports. One of 'transparent', 'informational, or 'breaking'"
        value: ${{ jobs.generate.outputs.verdict }}

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
        verdict: ${{ steps.generate-verdict.outputs.verdict }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Setup python 3 environment
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install required python modules
        shell: bash
        run: pip3 install -r requirements.txt

      - name: Create diff content location
        shell: bash
        run: mkdir -p ./tmp/versiondiff

      - name: Download previous version
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          gh release download ${{ inputs.previous }} \
            --repo ${{ github.repository }} \
            --dir .tmp/versiondiff/prev

      - name: Download current version
        if: ${{ inputs.current }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          gh release download ${{ inputs.previous }} \
            --repo ${{ github.repository }} \
            --dir .tmp/versiondiff/curr

      - name: Download project output
        if: ${{ ! inputs.current }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: project-output
          path: .tmp/versiondiff/curr/

      - name: Prepare project output
        if: ${{ ! inputs.current }}
        shell: bash
        run: |
          mv ./tmp/versiondiff/curr/merged_ontology/* .tmp/versiondiff/curr
          rm -r ./tmp/versiondiff/curr/merged_ontology

      - name: Generate version diff reports
        shell: bash
        run: |
          python3 .github/scripts/versiondiff.py \
            --previous "${{ inputs.previous }}" \
            --current "${{ github.ref_name }}" \
            --out .tmp/versiondiff/diff \
            --diff-level "${{ inputs.diff_level }}"

      - name: Upload diff reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diff-reports
          path: .tmp/versiondiff/diff

      - name: Generate verdict
        id: generate-verdict
        run: .github/scripts/diff_verdict.sh .tmp/versiondiff/diff >> $GITHUB_OUTPUT
