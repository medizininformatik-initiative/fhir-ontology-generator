[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "common"
version = "5.0.0"
dependencies = [
    "antlr4-python3-runtime==4.9.3",
    "cachetools==7.1.6",
    "fhir-resources==8.3.0",
    "isodate==0.7.2",
    "pydantic==2.10.5",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "requests==2.33.0",
    "semver==3.0",
    "typing-extensions==4.16.0",
]

[project.entry-points.pytest11]
common-test = "dataportal_generator.common_test.plugin"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" }
]
lint = [
    "ruff==0.16.1"
]
test = [
    "pytest==9.1.1",
    "pytest-env==1.7.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/dataportal_generator"]
include = [
    "src/dataportal_generator/**/resources/**" # Include all resource files
]

[tool.pytest_env]
env = [
    "CCTB_CLI_VERSION=2.0.0",
    "MII_CDS_TEST_DATA_VERSION=v2026.0.0-rc.1"
]